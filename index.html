<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zesty Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
    .container { max-width: 600px; margin: auto; }
    h1 { text-align: center; color: #333; margin-bottom: 5px; }
    .version-tag { text-align: center; color: #28a745; font-weight: bold; margin-bottom: 15px; }
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; }
    .card img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; background-color: #f0f0f0; }
    .item-info { flex: 1; }
    .item-name { font-size: 1.1rem; font-weight: bold; color: #222; display: block; }
    .item-price { font-size: 1rem; font-weight: bold; color: #d9534f; margin-top: 4px; display: block; }
    
    .btn-group { display: flex; gap: 6px; flex-direction: column; }
    .edit-btn { background-color: #ffc107; color: #333; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .delete-btn { background-color: #dc3545; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; }
    
    .admin-panel { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
    label { display: block; margin-top: 10px; font-size: 0.9rem; color: #555; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    button.add-btn { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background-color: #888; cursor: not-allowed; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🍽️ ZESTY MENU</h1>
  <div class="version-tag">✨ (إصدار جديد - إضافة وتعديل سريع)</div>

  <!-- لوحة إضافة صنف -->
  <div class="admin-panel">
    <h3>إضافة صنف جديد للمنيو</h3>
    <input type="text" id="itemName" placeholder="اسم الصنف (مثلاً: بيبسي)">
    <input type="number" id="itemPrice" placeholder="السعر (مثلاً: 30)">

    <label for="itemImage">صورة الوجبة (من الموبايل):</label>
    <input type="file" id="itemImage" accept="image/*">
    
    <button class="add-btn" id="addBtn">إضافة للمنيو</button>
  </div>

  <!-- عرض قائمة المنيو -->
  <h2>القائمة:</h2>
  <div id="menuContainer">جاري تحميل الأصناف...</div>
</div>

<!-- نافذة التعديل -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>تعديل الصنف ✏️</h3>
    <input type="hidden" id="editDocId">
    <input type="hidden" id="editOldImgUrl">
    
    <label>الاسم الجديد:</label>
    <input type="text" id="editName">
    
    <label>السعر الجديد:</label>
    <input type="number" id="editPrice">

    <label>تغيير الصورة (اختياري):</label>
    <input type="file" id="editImage" accept="image/*">

    <button id="saveEditBtn" style="background:#28a745; color:white; margin-top:10px;">حفظ التعديلات</button>
    <button id="removeImgBtn" style="background:#ff9800; color:white;">حذف الصورة فقط 🖼️❌</button>
    <button id="cancelEditBtn" style="background:#6c757d; color:white;">إلغاء</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTEPyT_ylg83IZRiO4sUSWs8LKOt3x11Q",
    authDomain: "zesty-menu-64909.firebaseapp.com",
    projectId: "zesty-menu-64909",
    storageBucket: "zesty-menu-64909.firebasestorage.app",
    messagingSenderId: "213107051074",
    appId: "1:213107051074:web:5e4fb4743206f99823fbdb",
    measurementId: "G-8QTNP9ERG4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const menuContainer = document.getElementById("menuContainer");
  const addBtn = document.getElementById("addBtn");
  const editModal = document.getElementById("editModal");

  // ضغط الصورة
  const compressImage = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const MAX_SIZE = 250;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_SIZE) {
            height *= MAX_SIZE / width;
            width = MAX_SIZE;
          }
        } else {
          if (height > MAX_SIZE) {
            width *= MAX_SIZE / height;
            height = MAX_SIZE;
          }
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.5));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });

  // 1. دالة جلب وعرض الأصناف المباشرة
  async function loadMenu() {
    try {
      const querySnapshot = await getDocs(collection(db, "menu"));
      menuContainer.innerHTML = "";
      
      if (querySnapshot.empty) {
        menuContainer.innerHTML = "<p style='text-align:center;'>لا توجد أصناف حالياً.</p>";
        return;
      }

      querySnapshot.forEach((document) => {
        const data = document.data();
        const id = document.id;
        const card = document.createElement("div");
        card.className = "card";
        
        const imgTag = data.img ? `<img src="${data.img}" alt="${data.name}">` : `<div style="width:65px;height:65px;background:#eee;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#888;">بدون صورة</div>`;

        card.innerHTML = `
          ${imgTag}
          <div class="item-info">
            <span class="item-name">${data.name || 'بدون اسم'}</span>
            <span class="item-price">${data.price ? data.price + ' ج.م' : ''}</span>
          </div>
          <div class="btn-group">
            <button class="edit-btn" onclick="openEditModal('${id}', '${data.name}', ${data.price}, '${data.img || ''}')">تعديل ✏️</button>
            <button class="delete-btn" onclick="deleteItem('${id}')">حذف 🗑️</button>
          </div>
        `;
        menuContainer.appendChild(card);
      });
    } catch (error) {
      menuContainer.innerHTML = "<p style='text-align:center; color:red;'>حدث خطأ في تحميل القائمة</p>";
    }
  }

  // تحميل المنيو عند فتح الصفحة أول مرة
  loadMenu();

  // 2. فتح نافذة التعديل
  window.openEditModal = (id, name, price, imgUrl) => {
    document.getElementById("editDocId").value = id;
    document.getElementById("editName").value = name;
    document.getElementById("editPrice").value = price;
    document.getElementById("editOldImgUrl").value = imgUrl;
    document.getElementById("editImage").value = "";
    editModal.style.display = "flex";
  };

  document.getElementById("cancelEditBtn").onclick = () => {
    editModal.style.display = "none";
  };

  // 3. حفظ التعديلات
  document.getElementById("saveEditBtn").onclick = async () => {
    const id = document.getElementById("editDocId").value;
    const newName = document.getElementById("editName").value;
    const newPrice = Number(document.getElementById("editPrice").value);
    const file = document.getElementById("editImage").files[0];
    let imgUrl = document.getElementById("editOldImgUrl").value;

    if(!newName || !newPrice) return alert("يرجى كتابة الاسم والسعر");

    document.getElementById("saveEditBtn").innerText = "جاري الحفظ...";

    try {
      if (file) {
        imgUrl = await compressImage(file);
      }

      await updateDoc(doc(db, "menu", id), {
        name: newName,
        price: newPrice,
        img: imgUrl
      });

      editModal.style.display = "none";
      alert("تم التعديل بنجاح!");
      loadMenu(); // إعادة تحميل القائمة
    } catch (e) {
      alert("حدث خطأ في التعديل: " + e.message);
    } finally {
      document.getElementById("saveEditBtn").innerText = "حفظ التعديلات";
    }
  };

  // 4. حذف الصورة فقط
  document.getElementById("removeImgBtn").onclick = async () => {
    const id = document.getElementById("editDocId").value;
    if(confirm("هل تريد إزالة الصورة من هذا الصنف؟")) {
      await updateDoc(doc(db, "menu", id), { img: "" });
      editModal.style.display = "none";
      alert("تمت إزالة الصورة!");
      loadMenu();
    }
  };

  // 5. أمر الحذف الكلي
  window.deleteItem = async (id) => {
    if (confirm("هل أنت متأكد من حذف هذا الصنف بالكامل؟")) {
      await deleteDoc(doc(db, "menu", id));
      loadMenu();
    }
  };

  // 6. إضافة صنف جديد
  addBtn.addEventListener("click", async () => {
    const name = document.getElementById("itemName").value;
    const price = Number(document.getElementById("itemPrice").value);
    const file = document.getElementById("itemImage").files[0];

    if (!name || !price) return alert("يرجى إدخال اسم الصنف والسعر");

    addBtn.disabled = true;
    addBtn.innerText = "جاري الإضافة...";

    try {
      let imageUrl = "";
      if (file) {
        imageUrl = await compressImage(file);
      }

      await addDoc(collection(db, "menu"), { name, price, img: imageUrl });

      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemImage").value = "";
      alert("تمت الإضافة بنجاح!");
      loadMenu(); // إعادة جلب البيانات فوراً لظهور الصنف الجديد
    } catch (error) {
      alert("حدث خطأ أثناء الإضافة: " + error.message);
    } finally {
      addBtn.disabled = false;
      addBtn.innerText = "إضافة للمنيو";
    }
  });
</script>

</body>
</html>
