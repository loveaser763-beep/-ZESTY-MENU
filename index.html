<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zesty Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
    .container { max-width: 600px; margin: auto; }
    h1 { text-align: center; color: #333; margin-bottom: 5px; }
    .version-tag { text-align: center; color: #28a745; font-weight: bold; margin-bottom: 15px; }
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; }
    .card img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; background-color: #f0f0f0; }
    .item-info { flex: 1; }
    .item-name { font-size: 1.1rem; font-weight: bold; color: #222; display: block; }
    .item-price { font-size: 1rem; font-weight: bold; color: #d9534f; margin-top: 4px; display: block; }
    
    .admin-panel { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
    label { display: block; margin-top: 10px; font-size: 0.9rem; color: #555; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    button.add-btn { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h1>ZESTY MENU 🍽️</h1>
  <div class="version-tag">✨ (قائمة الطعام)</div>

  <div class="admin-panel">
    <h3>إضافة صنف جديد للمنيو</h3>
    <input type="text" id="itemName" placeholder="اسم الصنف (مثلاً: بيبسي)">
    <input type="number" id="itemPrice" placeholder="السعر (مثلاً: 30)">

    <label for="itemImage">صورة الوجبة (من الموبايل):</label>
    <input type="file" id="itemImage" accept="image/*">
    
    <button class="add-btn" id="addBtn">إضافة للمنيo</button>
  </div>

  <h2>القائمة:</h2>
  <div id="menuContainer">جاري تحميل البيانات...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTEPyT_ylg83IZRiO4sUSWs8LKOt3x11Q",
    authDomain: "zesty-menu-64909.firebaseapp.com",
    projectId: "zesty-menu-64909",
    storageBucket: "zesty-menu-64909.firebasestorage.app",
    messagingSenderId: "213107051074",
    appId: "1:213107051074:web:5e4fb4743206f99823fbdb",
    measurementId: "G-8QTNP9ERG4"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const menuContainer = document.getElementById("menuContainer");

    // استماع البيانات
    onSnapshot(collection(db, "zesty_menu"), (snapshot) => {
      menuContainer.innerHTML = "";
      if (snapshot.empty) {
        menuContainer.innerHTML = "<p style='text-align:center;'>لا توجد أصناف حالياً في القائمة.</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        menuContainer.innerHTML += `
          <div class="card">
            <div class="item-info">
              <span class="item-name">${data.name}</span>
              <span class="item-price">${data.price} ج.م</span>
            </div>
          </div>
        `;
      });
    }, (error) => {
      alert("خطأ أثناء جلب القائمة من Firebase:\n" + error.message);
    });

    // إضافة
    document.getElementById("addBtn").addEventListener("click", async () => {
      const name = document.getElementById("itemName").value;
      const price = Number(document.getElementById("itemPrice").value);

      if(!name || !price) return alert("من فضلك اكتب الاسم والسعر");

      try {
        await addDoc(collection(db, "zesty_menu"), { name, price });
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        alert("تم الحفظ بنجاح!");
      } catch (err) {
        alert("خطأ أثناء الحفظ:\n" + err.message);
      }
    });

  } catch (err) {
    alert("خطأ في تشغيل الفايربيس:\n" + err.message);
  }
</script>

</body>
</html>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
