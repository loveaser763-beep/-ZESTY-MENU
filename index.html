<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zesty Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8f9fa; padding: 20px; }
    .container { max-width: 500px; margin: auto; }
    .status-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
    .card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #ddd; display: flex; justify-content: space-between; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>🍽️ Zesty Menu - اختبار القراءة</h2>

  <!-- صندوق حالة الاتصال -->
  <div id="status" class="status-box">⏳ جاري الاتصال بـ Firebase...</div>

  <div style="background:white; padding:15px; border-radius:8px; margin-bottom:20px;">
    <input type="text" id="itemName" placeholder="اسم الصنف">
    <input type="number" id="itemPrice" placeholder="السعر">
    <button id="addBtn">إضافة للمنيو</button>
  </div>

  <h3>القائمة:</h3>
  <div id="menuContainer">جاري التحميل...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTEPyT_ylg83IZRiO4sUSWs8LKOt3x11Q",
    authDomain: "zesty-menu-64909.firebaseapp.com",
    projectId: "zesty-menu-64909",
    storageBucket: "zesty-menu-64909.firebasestorage.app",
    messagingSenderId: "213107051074",
    appId: "1:213107051074:web:5e4fb4743206f99823fbdb",
    measurementId: "G-8QTNP9ERG4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const statusDiv = document.getElementById("status");
  const menuContainer = document.getElementById("menuContainer");

  // قراءة الأصناف مع إظهار سبب الخطأ فوراً
  onSnapshot(collection(db, "zesty_menu"), (snapshot) => {
    statusDiv.style.background = "#d4edda";
    statusDiv.style.color = "#155724";
    statusDiv.innerText = "✅ متصل بـ Firebase بنجاح! عدد الأصناف: " + snapshot.size;

    menuContainer.innerHTML = "";
    if (snapshot.empty) {
      menuContainer.innerHTML = "<p>لا توجد أصناف في قاعدة البيانات.</p>";
      return;
    }

    snapshot.forEach((doc) => {
      const data = doc.data();
      menuContainer.innerHTML += `
        <div class="card">
          <span><b>${data.name}</b></span>
          <span>${data.price} ج.م</span>
        </div>
      `;
    });
  }, (error) => {
    statusDiv.style.background = "#f8d7da";
    statusDiv.style.color = "#721c24";
    statusDiv.innerText = "❌ خطأ في القراءة: " + error.message;
    alert("سبب المشكلة: " + error.message);
  });

  // إضافة صنف
  document.getElementById("addBtn").onclick = async () => {
    const name = document.getElementById("itemName").value;
    const price = Number(document.getElementById("itemPrice").value);

    if (!name || !price) return alert("اكتب الاسم والسعر");

    try {
      await addDoc(collection(db, "zesty_menu"), { name, price });
      alert("تمت الإضافة!");
      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
    } catch (err) {
      alert("فشلت الإضافة: " + err.message);
    }
  };
</script>

</body>
</html>
