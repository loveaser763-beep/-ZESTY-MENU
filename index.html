<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Zesty Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; }
    h1 { text-align: center; color: #333; margin-bottom: 5px; }
    .version-tag { text-align: center; color: #28a745; font-weight: bold; margin-bottom: 15px; }
    
    .category-title { background: #e9ecef; color: #222; padding: 8px 12px; border-radius: 8px; margin-top: 20px; margin-bottom: 10px; font-size: 1.2rem; border-right: 5px solid #28a745; }
    
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
    .item-info { display: flex; flex-direction: column; }
    .item-name { font-size: 1.1rem; font-weight: bold; color: #222; }
    .item-price { font-size: 1rem; font-weight: bold; color: #d9534f; margin-top: 2px; }
    
    .btn-group { display: flex; gap: 6px; }
    .edit-btn { background-color: #ffc107; color: #333; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
    .delete-btn { background-color: #dc3545; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    
    .admin-panel { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; background-color: white; }
    button.add-btn { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🍽️ ZESTY MENU</h1>
  <div class="version-tag">✨ (قائمة الطعام المقسمة)</div>

  <!-- لوحة الإضافة -->
  <div class="admin-panel">
    <h3>إضافة صنف جديد</h3>
    
    <label style="font-size: 0.9rem; color: #555;">اختر القسم:</label>
    <select id="itemCategory">
      <option value="🍔 وجبات رئيسية">🍔 وجبات رئيسية</option>
      <option value="🥤 مشروبات">🥤 مشروبات</option>
      <option value="🍕 بيتزا وباستا">🍕 بيتزا وباستا</option>
      <option value="🍰 حلويات">🍰 حلويات</option>
      <option value="🍟 مقبلات وإضافات">🍟 مقبلات وإضافات</option>
    </select>

    <input type="text" id="itemName" placeholder="اسم الصنف (مثلاً: بيبسي)">
    <input type="number" id="itemPrice" placeholder="السعر (مثلاً: 30)">
    <button class="add-btn" id="addBtn">إضافة للمنيو</button>
  </div>

  <!-- عرض القائمة -->
  <h2>القائمة:</h2>
  <div id="menuContainer">جاري تحميل الأصناف...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTEPyT_ylg83IZRiO4sUSWs8LKOt3x11Q",
    authDomain: "zesty-menu-64909.firebaseapp.com",
    projectId: "zesty-menu-64909",
    storageBucket: "zesty-menu-64909.firebasestorage.app",
    messagingSenderId: "213107051074",
    appId: "1:213107051074:web:5e4fb4743206f99823fbdb",
    measurementId: "G-8QTNP9ERG4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const menuRef = collection(db, "zesty_menu");
  const menuContainer = document.getElementById("menuContainer");

  // عرض القائمة مقسمة فوراً
  onSnapshot(menuRef, (snapshot) => {
    menuContainer.innerHTML = "";
    if (snapshot.empty) {
      menuContainer.innerHTML = "<p style='text-align:center;'>لا توجد أصناف حالياً.</p>";
      return;
    }

    // تجميع الأصناف حسب القسم
    const categories = {};

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      const cat = data.category || "عام";

      if (!categories[cat]) {
        categories[cat] = [];
      }
      categories[cat].push({ id, ...data });
    });

    // طباعة كل قسم بأصنافه
    for (const [catName, items] of Object.entries(categories)) {
      const catHeader = document.createElement("div");
      catHeader.className = "category-title";
      catHeader.innerText = catName;
      menuContainer.appendChild(catHeader);

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name || 'بدون اسم'}</span>
            <span class="item-price">${item.price ? item.price + ' ج.م' : '0 ج.م'}</span>
          </div>
          <div class="btn-group">
            <button class="edit-btn" onclick="editItem('${item.id}', '${item.name}', ${item.price})">تعديل ✏️</button>
            <button class="delete-btn" onclick="deleteItem('${item.id}')">حذف 🗑️</button>
          </div>
        `;
        menuContainer.appendChild(card);
      });
    }
  });

  // إضافة صنف
  document.getElementById("addBtn").onclick = async () => {
    const category = document.getElementById("itemCategory").value;
    const name = document.getElementById("itemName").value;
    const price = Number(document.getElementById("itemPrice").value);

    if (!name || !price) return alert("يرجى كتابة الاسم والسعر");

    try {
      await addDoc(menuRef, { category, name, price });
      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
    } catch (e) {
      alert("خطأ في الإضافة: " + e.message);
    }
  };

  // تعديل صنف
  window.editItem = async (id, oldName, oldPrice) => {
    const newName = prompt("تعديل اسم الصنف:", oldName);
    const newPrice = prompt("تعديل السعر:", oldPrice);
    
    if (newName && newPrice) {
      await updateDoc(doc(db, "zesty_menu", id), {
        name: newName,
        price: Number(newPrice)
      });
    }
  };

  // حذف صنف
  window.deleteItem = async (id) => {
    if (confirm("هل أنت متأكد من حذف هذا الصنف؟")) {
      await deleteDoc(doc(db, "zesty_menu", id));
    }
  };
</script>

</body>
</html>
