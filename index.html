<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Zesty Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f8f9fa; padding: 15px; margin: 0; }
    .container { max-width: 500px; margin: auto; }
    h1 { text-align: center; color: #333; margin-bottom: 5px; }
    .version-tag { text-align: center; color: #28a745; font-weight: bold; margin-bottom: 15px; }
    
    .admin-panel { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; border-top: 4px solid #333; }
    .admin-panel h3 { margin-top: 0; color: #333; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    button.add-btn { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    
    /* زر التغذية السريعة */
    .bulk-btn { background-color: #6f42c1; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .bulk-btn:disabled { background-color: #aaa; cursor: not-allowed; }

    /* تنسيق إدارة الأقسام */
    .cat-list { margin-top: 10px; }
    .cat-item { display: flex; justify-content: space-between; align-items: center; background: #f1f3f5; padding: 8px 12px; margin-bottom: 5px; border-radius: 6px; }
    .cat-item span { font-weight: bold; color: #444; }
    .cat-btns { display: flex; gap: 5px; }
    .cat-btns button { padding: 4px 8px; width: auto; margin: 0; font-size: 0.85rem; border: none; border-radius: 4px; cursor: pointer; }
    .cat-btns .edit-c { background: #ffc107; color: #000; }
    .cat-btns .del-c { background: #dc3545; color: #fff; }

    /* تنسيق القائمة الرئيسية */
    .category-title { background: #e9ecef; color: #222; padding: 8px 12px; border-radius: 8px; margin-top: 25px; margin-bottom: 10px; font-size: 1.2rem; border-right: 5px solid #28a745; display: inline-block; width: 100%; box-sizing: border-box;}
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
    .item-info { display: flex; flex-direction: column; }
    .item-name { font-size: 1.1rem; font-weight: bold; color: #222; }
    .item-price { font-size: 1rem; font-weight: bold; color: #d9534f; margin-top: 2px; }
    .btn-group { display: flex; gap: 6px; }
    .btn-group button { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: auto; font-size: 0.9rem;}
    .edit-btn { background-color: #ffc107; color: #333; }
    .delete-btn { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h1>🍽️ ZESTY MENU</h1>
  <div class="version-tag">✨ (لوحة التحكم الشاملة)</div>

  <!-- لوحة إدارة الأقسام -->
  <div class="admin-panel" style="border-top-color: #007bff;">
    <h3>📂 إدارة الأقسام (تعديل / إضافة / حذف)</h3>
    <input type="text" id="newCategoryName" placeholder="اسم القسم (مثال: مشروبات ساخنة)">
    <button class="add-btn" style="background-color: #007bff;" id="addCatBtn">إضافة قسم جديد ➕</button>
    <div id="categoriesList" class="cat-list">جاري تحميل الأقسام...</div>
  </div>

  <!-- لوحة الإضافة للأصناف -->
  <div class="admin-panel" style="border-top-color: #28a745;">
    <h3>🍔 إضافة صنف للقائمة</h3>
    <label style="font-size: 0.9rem; color: #555;">اختر القسم:</label>
    <select id="itemCategory">
      <option value="">⏳ جاري تحميل الأقسام...</option>
    </select>
    <input type="text" id="itemName" placeholder="اسم الصنف (مثلاً: بيبسي)">
    <input type="number" id="itemPrice" placeholder="السعر (مثلاً: 30)">
    <button class="add-btn" id="addBtn">إضافة للمنيو ✔️</button>

    <!-- زر رفع المنيو الكامل تلقائياً -->
    <hr style="margin: 15px 0; border: 0; border-top: 1px dashed #ccc;">
    <button class="bulk-btn" id="seedBtn">رفع المنيو الكامل تلقائياً (114 صنف) 🚀</button>
  </div>

  <!-- عرض القائمة -->
  <h2 style="color: #444; border-bottom: 2px solid #ccc; padding-bottom: 5px;">القائمة:</h2>
  <div id="menuContainer">جاري تحميل الأصناف...</div>
</div>

  const categoriesRef = collection(db, "zesty_categories");

  // ==========================
  // 1. نظام الأقسام (Categories)
  // ==========================
  onSnapshot(categoriesRef, (snapshot) => {
    const catListDiv = document.getElementById("categoriesList");
    const itemCategorySelect = document.getElementById("itemCategory");
    
    catListDiv.innerHTML = "";
    itemCategorySelect.innerHTML = "";

    if (snapshot.empty) {
      catListDiv.innerHTML = "<div style='text-align:center; color:#777; font-size:0.9rem;'>لا توجد أقسام مضافة بعد.</div>";
      itemCategorySelect.innerHTML = "<option value='عام'>عام (افتراضي)</option>";
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      
      const option = document.createElement("option");
      option.value = data.name;
      option.innerText = data.name;
      itemCategorySelect.appendChild(option);

      catListDiv.innerHTML += `
        <div class="cat-item">
          <span>${data.name}</span>
          <div class="cat-btns">
            <button class="edit-c" onclick="editCategory('${id}', '${data.name}')">✏️</button>
            <button class="del-c" onclick="deleteCategory('${id}', '${data.name}')">🗑️</button>
          </div>
        </div>
      `;
    });
  });

  document.getElementById("addCatBtn").onclick = async () => {
    const catName = document.getElementById("newCategoryName").value;
    if (!catName) return alert("اكتب اسم القسم أولاً!");
    
    await addDoc(categoriesRef, { name: catName });
    document.getElementById("newCategoryName").value = "";
  };

  window.editCategory = async (id, oldName) => {
    const newName = prompt("تعديل اسم القسم:", oldName);
    if (newName && newName !== oldName) {
      await updateDoc(doc(db, "zesty_categories", id), { name: newName });
      
      const q = query(menuRef, where("category", "==", oldName));
      const querySnapshot = await getDocs(q);
      querySnapshot.forEach(async (itemDoc) => {
        await updateDoc(doc(db, "zesty_menu", itemDoc.id), { category: newName });
      });
      alert("تم تعديل القسم وتحديث الأصناف بنجاح!");
    }
  };

  window.deleteCategory = async (id, catName) => {
    if (confirm(`هل أنت متأكد من حذف قسم "${catName}"؟ \n(الأصناف بداخلة لن تحذف ولكن ستظهر بدون قسم)`)) {
      await deleteDoc(doc(db, "zesty_categories", id));
    }
  };

  // ==========================
  // 2. نظام الأصناف (Menu Items)
  // ==========================
  onSnapshot(menuRef, (snapshot) => {
    const menuContainer = document.getElementById("menuContainer");
    menuContainer.innerHTML = "";
    
    if (snapshot.empty) {
      menuContainer.innerHTML = "<p style='text-align:center;'>لا توجد أصناف حالياً.</p>";
      return;
    }

    const categories = {};
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const cat = data.category || "أخرى (بدون قسم)";
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push({ id: docSnap.id, ...data });
    });

    for (const [catName, items] of Object.entries(categories)) {
      menuContainer.innerHTML += `<div class="category-title">${catName}</div>`;
      items.forEach((item) => {
        menuContainer.innerHTML += `
          <div class="card">
            <div class="item-info">
              <span class="item-name">${item.name}</span>
              <span class="item-price">${item.price} ج.م</span>
            </div>
            <div class="btn-group">
              <button class="edit-btn" onclick="editItem('${item.id}', '${item.name}', ${item.price})">✏️</button>
              <button class="delete-btn" onclick="deleteItem('${item.id}')">🗑️</button>
            </div>
          </div>
        `;
      });
    }
  });

    const category = document.getElementById("itemCategory").value || "عام";
    const name = document.getElementById("itemName").value;
    const price = Number(document.getElementById("itemPrice").value);

    await addDoc(menuRef, { category, name, price });
    document.getElementById("itemName").value = "";
    document.getElementById("itemPrice").value = "";
  };

    }

  document.getElementById("seedBtn").onclick = async () => {
    if (!confirm("هل تريد رفع الـ 114 صنف كاملة بالأنواع والأقسام إلى قاعدة البيانات الآن؟")) return;

    const seedBtn = document.getElementById("seedBtn");
    seedBtn.disabled = true;
    seedBtn.innerText = "⏳ جاري رفع المنيو بالكامل...";

    try {
      // 1. إضافة الأقسام الفريدة أولاً
      const categoriesSet = new Set(fullMenuData.map(item => item.category));
      for (const catName of categoriesSet) {
        const q = query(categoriesRef, where("name", "==", catName));
        const snap = await getDocs(q);
        if (snap.empty) {
          await addDoc(categoriesRef, { name: catName });
        }
      }

      // 2. إضافة كافة الأصناف
      for (const item of fullMenuData) {
        await addDoc(menuRef, item);
      }

      alert("🎉 تم إضافة الـ 114 صنف بنجاح وبسرعة فائقة!");
    } catch (err) {
      console.error(err);
      alert("حدث خطأ أثناء إضافة البيانات: " + err.message);
    } finally {
      seedBtn.disabled = false;
      seedBtn.innerText = "رفع المنيو الكامل تلقائياً (114 صنف) 🚀";
    }
  };
