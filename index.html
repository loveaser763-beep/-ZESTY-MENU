<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zesty Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
    .container { max-width: 600px; margin: auto; }
    h1 { text-align: center; color: #333; }
    h2.category-title { color: #2c3e50; border-bottom: 2px solid #28a745; padding-bottom: 5px; margin-top: 25px; font-size: 1.3rem; }
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; }
    .card img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; background-color: #f0f0f0; }
    .item-info { flex: 1; }
    .item-name { font-size: 1.1rem; font-weight: bold; color: #222; display: block; }
    .item-price { font-size: 1rem; font-weight: bold; color: #d9534f; margin-top: 4px; display: block; }
    .delete-btn { background-color: #ff4d4d; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; }
    .admin-panel { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
    label { display: block; margin-top: 10px; font-size: 0.9rem; color: #555; }
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    button.add-btn { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background-color: #888; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <h1>🍽️ ZESTY MENU</h1>

  <!-- لوحة إضافة صنف جديد -->
  <div class="admin-panel">
    <h3>إضافة صنف جديد للمنيو</h3>
    <input type="text" id="itemName" placeholder="اسم الصنف (مثلاً: بيبسي)">
    <input type="number" id="itemPrice" placeholder="السعر (مثلاً: 30)">
    
    <label for="itemCategory">اختر القسم:</label>
    <select id="itemCategory">
      <option value="مشروبات">🥤 قسم المشروبات</option>
      <option value="عصائر">🍹 قسم العصائر</option>
      <option value="سناكس">🍟 قسم السناكس</option>
    </select>

    <label for="itemImage">صورة الوجبة (من الموبايل):</label>
    <input type="file" id="itemImage" accept="image/*">
    
    <button class="add-btn" id="addBtn">إضافة للمنيو</button>
  </div>

  <!-- عرض قائمة المنيو مقسمة -->
  <h2>القائمة:</h2>
  <div id="menuContainer">جاري تحميل المنيو...</div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTEPyT_ylg83IZRiO4sUSWs8LKOt3x11Q",
    authDomain: "zesty-menu-64909.firebaseapp.com",
    projectId: "zesty-menu-64909",
    storageBucket: "zesty-menu-64909.firebasestorage.app",
    messagingSenderId: "213107051074",
    appId: "1:213107051074:web:5e4fb4743206f99823fbdb",
    measurementId: "G-8QTNP9ERG4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const menuContainer = document.getElementById("menuContainer");
  const addBtn = document.getElementById("addBtn");

  // 1. عرض الأصناف مقسمة حسب القسم
  onSnapshot(collection(db, "menu"), (snapshot) => {
    menuContainer.innerHTML = "";
    
    const categories = { "مشروبات": [], "عصائر": [], "سناكس": [] };

    snapshot.forEach((document) => {
      const data = document.data();
      const item = { id: document.id, ...data };
      const cat = data.category || "مشروبات";
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(item);
    });

    for (const [categoryName, items] of Object.entries(categories)) {
      if (items.length > 0) {
        const catHeader = document.createElement("h2");
        catHeader.className = "category-title";
        catHeader.innerText = categoryName === "مشروبات" ? "🥤 قسم المشروبات" : categoryName === "عصائر" ? "🍹 قسم العصائر" : "🍟 قسم السناكس";
        menuContainer.appendChild(catHeader);

        items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "card";
          const imgTag = item.img ? `<img src="${item.img}" alt="${item.name}">` : `<div style="width:65px;height:65px;background:#eee;border-radius:8px;"></div>`;

          card.innerHTML = `
            ${imgTag}
            <div class="item-info">
              <span class="item-name">${item.name || 'بدون اسم'}</span>
              <span class="item-price">${item.price ? item.price + ' ج.م' : ''}</span>
            </div>
            <button class="delete-btn" onclick="deleteItem('${item.id}')">حذف 🗑️</button>
          `;
          menuContainer.appendChild(card);
        });
      }
    }
  });

  // 2. دالة الحذف
  window.deleteItem = async (id) => {
    if (confirm("هل انت متأكد من حذف هذا الصنف؟")) {
      await deleteDoc(doc(db, "menu", id));
    }
  };

  // 3. إضافة الصنف بالقسم والصورة
  addBtn.addEventListener("click", async () => {
    const name = document.getElementById("itemName").value;
    const price = Number(document.getElementById("itemPrice").value);
    const category = document.getElementById("itemCategory").value;
    const fileInput = document.getElementById("itemImage");
    const file = fileInput.files[0];

    if (!name || !price) {
      alert("يرجى إدخال اسم الصنف والسعر");
      return;
    }

    addBtn.disabled = true;
    addBtn.innerText = "جاري الإضافة...";

    try {
      let imageUrl = "";

      if (file) {
        const formData = new FormData();
        formData.append("image", file);
        const res = await fetch("https://api.imgbb.com/1/upload?key=6d207e02198a847aa98d0a2a901485a5", {
          method: "POST",
          body: formData
        });
        const resData = await res.json();
        if(resData.success) {
          imageUrl = resData.data.url;
        }
      }

      await addDoc(collection(db, "menu"), {
        name: name,
        price: price,
        category: category,
        img: imageUrl
      });

      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
      fileInput.value = "";
      alert("تمت الإضافة بنجاح!");
    } catch (error) {
      alert("حدث خطأ: " + error.message);
    } finally {
      addBtn.disabled = false;
      addBtn.innerText = "إضافة للمنيو";
    }
  });
</script>

</body>
</html>
