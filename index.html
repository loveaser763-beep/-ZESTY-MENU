<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Zesty Menu</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f8; padding: 15px; margin: 0; }
    .container { max-width: 500px; margin: auto; }
    
    /* هيدر الموقع - البنر الرئيسي */
    .header-card { 
      background: #ffffff; 
      border-radius: 16px; 
      overflow: hidden; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
      margin-bottom: 20px; 
      text-align: center;
    }
    .banner-img { 
      width: 100%; 
      height: auto; 
      display: block; 
      object-fit: contain; 
      border-bottom: 3px solid #28a745;
    }
    .header-details { padding: 15px 10px; }
    h1 { color: #1a1a1a; margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: 0.5px; }
    .version-tag { color: #28a745; font-weight: 600; font-size: 0.88rem; margin-top: 4px; }
    
    /* الكروت ولوحات التحكم */
    .admin-panel { background: #fff; padding: 16px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 18px; border-top: 4px solid #333; }
    .admin-panel h3 { margin-top: 0; color: #222; font-size: 1.05rem; border-bottom: 1px solid #eee; padding-bottom: 8px; font-weight: 700; }
    
    input, select, button { padding: 11px; margin: 6px 0; width: 100%; box-sizing: border-box; border: 1px solid #dcdcdc; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: #28a745; }
    button.add-btn { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button.add-btn:active { opacity: 0.9; }
    
    /* تنسيق إدارة الأقسام */
    .cat-list { margin-top: 10px; }
    .cat-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 8px 12px; margin-bottom: 6px; border-radius: 8px; border: 1px solid #e9ecef; }
    .cat-item span { font-weight: bold; color: #333; }
    .cat-btns { display: flex; gap: 5px; }
    .cat-btns button { padding: 5px 9px; width: auto; margin: 0; font-size: 0.85rem; border: none; border-radius: 6px; cursor: pointer; }
    .cat-btns .edit-c { background: #ffc107; color: #000; }
    .cat-btns .del-c { background: #dc3545; color: #fff; }

    /* تنسيق القائمة الرئيسية */
    .category-title { background: #1a1a1a; color: #fff; padding: 10px 14px; border-radius: 10px; margin-top: 25px; margin-bottom: 12px; font-size: 1.15rem; font-weight: bold; border-right: 5px solid #28a745; display: block; box-sizing: border-box;}
    .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: space-between; border: 1px solid #f0f0f0; }
    .item-info { display: flex; flex-direction: column; }
    .item-name { font-size: 1.05rem; font-weight: bold; color: #222; }
    .item-price { font-size: 1rem; font-weight: 800; color: #28a745; margin-top: 3px; }
    .btn-group { display: flex; gap: 6px; }
    .btn-group button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: auto; font-size: 0.85rem;}
    .edit-btn { background-color: #ffc107; color: #222; }
    .delete-btn { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

<div class="container">
  <!-- هيدر الصفحة وبنر الصورة الجديدة -->
  <div class="header-card">
    <img id="mainLogo" class="banner-img" src="" alt="ZESTY Banner">
    <div class="header-details">
      <h1>ZESTY MENU</h1>
      <div class="version-tag">✨ (لوحة التحكم الشاملة)</div>
    </div>
  </div>

  <!-- لوحة إعدادات البنر/اللوجو -->
  <div class="admin-panel" style="border-top-color: #6f42c1;">
    <h3>🖼️ رابط صورة الواجهة (Banner)</h3>
    <input type="text" id="logoUrlInput" placeholder="ضع رابط الصورة هنا">
    <button class="add-btn" style="background-color: #6f42c1;" id="saveLogoBtn">حفظ الصورة 💾</button>
  </div>

  <!-- لوحة إدارة الأقسام -->
  <div class="admin-panel" style="border-top-color: #007bff;">
    <h3>📂 إدارة الأقسام (تعديل / إضافة / حذف)</h3>
    <input type="text" id="newCategoryName" placeholder="اسم القسم (مثال: مشروبات ساخنة)">
    <button class="add-btn" style="background-color: #007bff;" id="addCatBtn">إضافة قسم جديد ➕</button>
    <div id="categoriesList" class="cat-list">جاري تحميل الأقسام...</div>
  </div>

  <!-- لوحة الإضافة للأصناف -->
  <div class="admin-panel" style="border-top-color: #28a745;">
    <h3>🍔 إضافة صنف للقائمة</h3>
    <label style="font-size: 0.85rem; color: #666; font-weight: bold;">اختر القسم:</label>
    <select id="itemCategory">
      <option value="">⏳ جاري تحميل الأقسام...</option>
    </select>
    <input type="text" id="itemName" placeholder="اسم الصنف (مثلاً: بيبسي)">
    <input type="number" id="itemPrice" placeholder="السعر (مثلاً: 30)">
    <button class="add-btn" id="addBtn">إضافة للمنيو ✔️</button>
  </div>

  <!-- عرض القائمة -->
  <h2 style="color: #222; border-bottom: 2px solid #ddd; padding-bottom: 8px; font-size: 1.3rem;">القائمة:</h2>
  <div id="menuContainer">جاري تحميل الأصناف...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTEPyT_ylg83IZRiO4sUSWs8LKOt3x11Q",
    authDomain: "zesty-menu-64909.firebaseapp.com",
    projectId: "zesty-menu-64909",
    storageBucket: "zesty-menu-64909.firebasestorage.app",
    messagingSenderId: "213107051074",
    appId: "1:213107051074:web:5e4fb4743206f99823fbdb",
    measurementId: "G-8QTNP9ERG4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  const menuRef = collection(db, "zesty_menu");
  const categoriesRef = collection(db, "zesty_categories");
  const settingsDoc = doc(db, "zesty_settings", "general");

  // الصورة المباشرة الجديدة الافتراضية
  const DEFAULT_BANNER = "https://i.ibb.co/0pkgqb0y/image.jpg";

  // ==========================
  // 1. نظام الصورة (Banner Settings)
  // ==========================
  onSnapshot(settingsDoc, (docSnap) => {
    const mainLogo = document.getElementById("mainLogo");
    let currentUrl = DEFAULT_BANNER;
    
    if (docSnap.exists() && docSnap.data().logoUrl) {
      currentUrl = docSnap.data().logoUrl;
    }
    
    mainLogo.src = currentUrl;
    mainLogo.style.display = "block";
    document.getElementById("logoUrlInput").value = currentUrl;
  });

  document.getElementById("saveLogoBtn").onclick = async () => {
    const url = document.getElementById("logoUrlInput").value.trim();
    if (!url) return alert("من فضلك اكتب رابط الصورة!");
    
    try {
      await setDoc(settingsDoc, { logoUrl: url }, { merge: true });
      alert("تم حفظ الصورة بنجاح!");
    } catch (e) {
      alert("خطأ في الحفظ: " + e.message);
    }
  };

  // ==========================
  // 2. نظام الأقسام (Categories)
  // ==========================
  onSnapshot(categoriesRef, (snapshot) => {
    const catListDiv = document.getElementById("categoriesList");
    const itemCategorySelect = document.getElementById("itemCategory");
    
    catListDiv.innerHTML = "";
    itemCategorySelect.innerHTML = "";

    if (snapshot.empty) {
      catListDiv.innerHTML = "<div style='text-align:center; color:#777; font-size:0.9rem;'>لا توجد أقسام مضافة بعد.</div>";
      itemCategorySelect.innerHTML = "<option value='عام'>عام (افتراضي)</option>";
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      
      const option = document.createElement("option");
      option.value = data.name;
      option.innerText = data.name;
      itemCategorySelect.appendChild(option);

      catListDiv.innerHTML += `
        <div class="cat-item">
          <span>${data.name}</span>
          <div class="cat-btns">
            <button class="edit-c" onclick="editCategory('${id}', '${data.name}')">✏️</button>
            <button class="del-c" onclick="deleteCategory('${id}', '${data.name}')">🗑️</button>
          </div>
        </div>
      `;
    });
  });

  document.getElementById("addCatBtn").onclick = async () => {
    const catName = document.getElementById("newCategoryName").value;
    if (!catName) return alert("اكتب اسم القسم أولاً!");
    
    await addDoc(categoriesRef, { name: catName });
    document.getElementById("newCategoryName").value = "";
  };

  window.editCategory = async (id, oldName) => {
    const newName = prompt("تعديل اسم القسم:", oldName);
    if (newName && newName !== oldName) {
      await updateDoc(doc(doc(db, "zesty_categories", id)), { name: newName });
      
      const q = query(menuRef, where("category", "==", oldName));
      const querySnapshot = await getDocs(q);
      querySnapshot.forEach(async (itemDoc) => {
        await updateDoc(doc(db, "zesty_menu", itemDoc.id), { category: newName });
      });
      alert("تم تعديل القسم وتحديث الأصناف بنجاح!");
    }
  };

  window.deleteCategory = async (id, catName) => {
    if (confirm(`هل أنت متأكد من حذف قسم "${catName}"؟`)) {
      await deleteDoc(doc(db, "zesty_categories", id));
    }
  };

  // ==========================
  // 3. نظام الأصناف (Menu Items)
  // ==========================
  onSnapshot(menuRef, (snapshot) => {
    const menuContainer = document.getElementById("menuContainer");
    menuContainer.innerHTML = "";
    
    if (snapshot.empty) {
      menuContainer.innerHTML = "<p style='text-align:center;'>لا توجد أصناف حالياً.</p>";
      return;
    }

    const categories = {};
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const cat = data.category || "أخرى (بدون قسم)";
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push({ id: docSnap.id, ...data });
    });

    for (const [catName, items] of Object.entries(categories)) {
      menuContainer.innerHTML += `<div class="category-title">${catName}</div>`;
      items.forEach((item) => {
        menuContainer.innerHTML += `
          <div class="card">
            <div class="item-info">
              <span class="item-name">${item.name}</span>
              <span class="item-price">${item.price} ج.م</span>
            </div>
            <div class="btn-group">
              <button class="edit-btn" onclick="editItem('${item.id}', '${item.name}', ${item.price})">✏️</button>
              <button class="delete-btn" onclick="deleteItem('${item.id}')">🗑️</button>
            </div>
          </div>
        `;
      });
    }
  });

  document.getElementById("addBtn").onclick = async () => {
    const category = document.getElementById("itemCategory").value || "عام";
    const name = document.getElementById("itemName").value;
    const price = Number(document.getElementById("itemPrice").value);

    if (!name || !price) return alert("يرجى كتابة الاسم والسعر");

    await addDoc(menuRef, { category, name, price });
    document.getElementById("itemName").value = "";
    document.getElementById("itemPrice").value = "";
  };

  window.editItem = async (id, oldName, oldPrice) => {
    const newName = prompt("تعديل اسم الصنف:", oldName);
    const newPrice = prompt("تعديل السعر:", oldPrice);
    if (newName && newPrice) {
      await updateDoc(doc(db, "zesty_menu", id), { name: newName, price: Number(newPrice) });
    }
  };

  window.deleteItem = async (id) => {
    if (confirm("حذف هذا الصنف؟")) {
      await deleteDoc(doc(db, "zesty_menu", id));
    }
  };
</script>

</body>
</html>
